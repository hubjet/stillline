<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="Page not found — Stillline Moments.">
  <title>Page Not Found — Stillline Moments</title>
  <link rel="icon" type="image/svg+xml" href="stillline-mark.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
  :root{
    --paper:#fbfbfd; --surface:#ffffff; --grey:#f5f5f7; --ink:#1d1d1f;
    --muted:#6e6e73; --body:#424245; --line:#d2d2d7; --accent:#0066cc;
    --radius:18px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-gutter:stable}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:#d9e8ff}
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:0 0 8px 0;z-index:100}
  .skip-link:focus{left:0;color:#fff}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
  .topline{display:none}
  header{position:sticky;top:0;z-index:50;background:rgba(251,251,253,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:24px;padding:8px max(22px,calc((100vw - 1024px)/2));min-height:52px}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand:hover{text-decoration:none}
  .brand-mark{height:36px;width:auto;display:block}
  .brand-name{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
  .brand-name .brand-en{font-weight:400;color:var(--muted)}
  .brand span{font-weight:600}
  .site-nav{display:flex;gap:2px;margin-left:auto;align-items:center}
  .site-nav a{font-size:12px;line-height:1;color:var(--ink);padding:7px 11px;border-radius:999px;white-space:nowrap}
  .site-nav a:hover{color:var(--accent);text-decoration:none;background:var(--grey)}
  .site-nav a[aria-current="page"]{background:var(--grey);font-weight:600;color:var(--ink)}
  .header-tools{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .language-toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font:600 12px/1 var(--sans);color:var(--ink);cursor:pointer}
  .language-toggle:hover{border-color:var(--muted)}
  main{display:block;max-width:1024px;margin:0 auto;padding:88px 22px 96px}
  main>p{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 12px}
  main nav{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
  .content{max-width:1024px;margin:0 auto;padding:0 22px}
  .hero{max-width:1024px;margin:0 auto;padding:88px 22px 56px;text-align:center}
  .eyebrow{font-size:17px;font-weight:600;color:var(--accent);margin:0 0 12px}
  h1{font-size:clamp(40px,6vw,56px);line-height:1.08;letter-spacing:-.022em;font-weight:700;margin:0 0 16px;text-align:center}
  .lead{font-size:21px;line-height:1.47;color:var(--muted);max-width:640px;margin:0 auto}
  .intro{font-size:21px;line-height:1.47;color:var(--muted);max-width:680px;margin:0 auto}
  .updated{margin-top:28px;font-size:14px;color:var(--muted)}
  .intro-copy{max-width:680px;margin:0 auto}
  .intro-copy p{font-size:21px;line-height:1.47;color:var(--muted);text-align:center;margin:0 0 12px}
  .content>p{font-size:19px;line-height:1.6;color:var(--body);max-width:680px;margin:0 auto 16px;text-align:center}
  section{margin-top:72px;padding-top:64px;border-top:1px solid var(--line)}
  .features-section{margin-top:80px}
  h2{font-size:clamp(28px,4vw,36px);line-height:1.15;letter-spacing:-.02em;font-weight:700;text-align:center;margin:0 0 16px}
  h3{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.015em;margin:0 0 8px;text-align:center}
  .content section p{font-size:17px;line-height:1.6;color:var(--body);max-width:680px;margin:0 auto 12px;text-align:center}
  .feature-list{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
  .feature{background:var(--grey);border-radius:var(--radius);padding:44px 32px 0;text-align:center;overflow:hidden}
  .feature h3{margin-bottom:10px}
  .feature p{color:var(--body);font-size:17px;line-height:1.55;max-width:420px;margin:0 auto 28px;text-align:center}
  .feature-shot{margin:0;background:var(--surface);border-radius:14px 14px 0 0;padding:28px 24px 0;box-shadow:0 -4px 24px rgba(0,0,0,.04)}
  .feature-shot img{width:220px;max-width:100%;height:auto;display:block;margin:0 auto;border-radius:12px 12px 0 0;box-shadow:0 12px 32px rgba(0,0,0,.12)}
  .tip-screens{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:640px;margin:36px auto 0}
  .tip-screens-single{grid-template-columns:1fr;max-width:340px}
  .tip-screens figure{margin:0;background:var(--grey);border-radius:var(--radius);padding:28px 24px 0;overflow:hidden}
  .tip-screens img{width:220px;max-width:100%;height:auto;display:block;margin:0 auto;border-radius:12px 12px 0 0;box-shadow:0 12px 32px rgba(0,0,0,.12)}
  .tip-note{max-width:640px;margin:28px auto 0;background:var(--grey);border-radius:14px;padding:16px 20px;font-size:15px;line-height:1.55;color:var(--body);text-align:left}
  .tip-note strong{color:var(--ink)}
  .closing{margin-top:96px;padding:64px 24px;background:var(--grey);border-radius:var(--radius);text-align:center}
  .closing strong{font-size:clamp(24px,3.5vw,32px);line-height:1.2;letter-spacing:-.02em;font-weight:700}
  .closing p{margin:14px auto 0;max-width:560px;color:var(--body);font-size:17px;text-align:center}
  .signature{margin:16px 0 0;color:var(--muted);font-size:14px}
  .last-line{margin:8px 0 0;color:var(--muted);font-size:17px}
  .contact-card{max-width:520px;margin:36px auto 0;background:var(--grey);border-radius:var(--radius);padding:32px;text-align:center}
  .contact-card p{margin:0 0 8px;font-size:19px;color:var(--ink);text-align:center}
  .contact-card p:last-child{margin-bottom:0}
  footer{background:var(--grey);color:var(--muted);font-size:12px;line-height:1.6;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px max(22px,calc((100vw - 1024px)/2))}
  footer span{color:var(--muted)}
  /* Privacy page: narrow centred legal column, TOC as a grey card */
  .layout{display:block;max-width:980px;margin:0 auto;padding:0 22px}
  .layout>nav{position:static;background:var(--grey);border-radius:var(--radius);padding:28px 32px;margin:40px 0 8px}
  .layout>nav p{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
  .layout>nav a{display:inline-block;margin:0 20px 10px 0;font-size:15px;line-height:1.5}
  article:not(.content) section{margin-top:56px;padding-top:48px}
  article:not(.content) h2{font-size:28px;text-align:left;margin-bottom:14px}
  article:not(.content) h3{font-size:20px;text-align:left;margin:24px 0 8px}
  article:not(.content) p{font-size:17px;line-height:1.65;color:var(--body);text-align:left;max-width:none;margin:0 0 12px}
  article:not(.content) ul{font-size:17px;line-height:1.65;color:var(--body);margin:0 0 12px;padding-left:22px}
  article:not(.content) li{margin-bottom:6px}
  article:not(.content)>p{font-size:17px;text-align:left;max-width:none;margin:0 0 12px}
  article:not(.content) .contact{font-size:19px}

  .tip-screens-framed{max-width:640px}
  .tip-screens-framed figure{background:transparent;padding:0;border-radius:0;overflow:visible}
  .tip-screens-framed img{width:280px;border-radius:0;box-shadow:none}
  @media (max-width:760px){
    header{gap:12px;padding:8px 16px}
    .site-nav{overflow-x:auto;scrollbar-width:none}
    .site-nav::-webkit-scrollbar{display:none}
    .hero{padding:64px 22px 40px}
    h1{font-size:36px}
    main{padding-top:64px}
    .lead,.intro,.intro-copy p{font-size:19px}
    section{margin-top:56px;padding-top:48px}
    .feature-list{grid-template-columns:1fr}
    .tip-screens{grid-template-columns:1fr;max-width:340px}
    .layout>nav{padding:24px 20px}
    article:not(.content) h2{font-size:24px}
    footer{justify-content:center;text-align:center}
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#000000;--surface:#1c1c1e;--grey:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--body:#d2d2d7;--line:#38383a;--accent:#2997ff}
    header{background:rgba(0,0,0,.72);border-bottom-color:rgba(255,255,255,.12)}
    .feature-shot{background:#2c2c2e}
    .language-toggle{background:#1c1c1e;color:#f5f5f7;border-color:#38383a}
    ::selection{background:#0a3d6e}
  }
</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="topline" aria-hidden="true"></div>
  <header>
    <a class="brand" href="index.html" aria-label="Stillline Moments"><img class="brand-mark" src="stillline-mark.svg" alt=""><span>Stillline Moments</span></a>
  </header>
  <main id="main">
    <h1>Page not found</h1>
    <p>This page doesn’t exist, or it may have moved.</p>
    <p>页面不存在，或已移动。</p>
    <nav aria-label="Site navigation">
      <a href="index.html">Privacy Policy · 隐私政策</a>
      <a href="product.html">Product · 产品介绍</a>
      <a href="philosophy.html">Our Philosophy · 设计理念</a>
      <a href="tips.html">Tips · 使用技巧</a>
      <a href="contact.html">Contact · 联系我们</a>
    </nav>
  </main>
  <footer>
    <span>© 2026 Stillline Moments</span>
  </footer>
</body>
</html>
